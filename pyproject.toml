[project]
name = "blender-smart-modeling-mcp"
version = "0.2.0"
description = "Token-efficient semantic modeling MCP for Blender"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2.0"]

[project.scripts]
blender-smart-mcp = "smart_blender_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_blender_mcp"]
