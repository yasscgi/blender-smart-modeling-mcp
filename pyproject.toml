[project]
name = "blender-smart-modeling-mcp"
version = "0.5.0"
description = "Token-efficient semantic and orthographic 2D-to-3D modeling MCP for Blender"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2.0,<2"]

[project.scripts]
blender-smart-mcp = "smart_blender_mcp.server:main"
blender-smart-mcp-compact = "smart_blender_mcp.compact_server:main"
blender-smart-benchmark = "smart_blender_mcp.benchmark:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_blender_mcp"]
